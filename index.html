<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap">
<style>
:root{--gold:#ffd36b;--bg:#05020d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Yatra One',Georgia,serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#fx{mix-blend-mode:screen}
#txt{position:fixed;left:0;right:0;top:7%;text-align:center;padding:0 7%;pointer-events:none;visibility:hidden}
#txt.on{visibility:visible}
h1{margin:0;font-weight:400;font-size:clamp(2.6rem,13vw,5.4rem);line-height:1.05;color:var(--gold);text-shadow:0 0 12px #ff9d2e,0 0 32px #ff6a00,0 0 70px #c2185b}
h1 span{display:inline-block;opacity:0}
#txt.on h1 span{animation:pop .9s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.55)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:.3em 0 0;font-weight:400;font-size:clamp(1.4rem,6.6vw,2.4rem);color:#ffe9b8;text-shadow:0 0 14px #ff8a00;opacity:0}
p{margin:1em auto 0;max-width:30em;font-size:clamp(.95rem,3.9vw,1.2rem);line-height:1.55;color:#ffe3c2;text-shadow:0 0 10px #000,0 2px 14px #000;font-family:Georgia,serif;font-style:italic;opacity:0}
p b{font-family:'Yatra One',Georgia,serif;font-style:normal;font-weight:400;color:#fff1cf}
#from{margin-top:.9em;color:var(--gold);font-size:clamp(1rem,4.4vw,1.4rem);text-shadow:0 0 12px #ff8a00;opacity:0}
#txt.on h2{animation:fin 1s 1.3s both}#txt.on p{animation:fin 1s 2s both}#txt.on #from{animation:fin 1s 2.8s both}
#hint{position:fixed;left:0;right:0;bottom:14%;text-align:center;font-size:clamp(1rem,4.6vw,1.4rem);color:#ffe0a0;letter-spacing:.14em;animation:pulse 1.6s ease-in-out infinite;pointer-events:none;transition:opacity .6s}
@keyframes pulse{50%{opacity:.3}}
#snd{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:3;background:rgba(0,0,0,.4);color:#ffd36b;border:1px solid #ffd36b66;border-radius:20px;padding:6px 12px;font:inherit;font-size:.8rem;display:none}
</style></head><body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="txt"><h1 id="h1"></h1><h2>शुभ दीपावली</h2>
<p><b>आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ!</b><br>May this festival of lights fill your home with joy, your heart with peace and your life with endless prosperity.</p>
<div id="from"></div></div>
<div id="hint">TAP TO LIGHT THE DIYA</div><button id="snd">♪ sound on</button>
<script>
// Open  index.html#Rahul  to sign the wish "With love, Rahul". Tap anywhere for more fireworks.
const $ = id => document.getElementById(id), R = Math.random;
const NAME = decodeURIComponent(location.hash.slice(1));
if (NAME) $("from").textContent = "With love, " + NAME; else $("from").remove();
[..."Happy Diwali"].forEach((c, i) => { const s = document.createElement("span"); s.textContent = c === " " ? "\u00a0" : c; s.style.setProperty("--d", i * .09 + "s"); $("h1").appendChild(s); });
const bg = $("bg"), fx = $("fx"), b = bg.getContext("2d"), g = fx.getContext("2d");
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x)), ease = x => x * x * (3 - 2 * x);
const mixc = (a, c, f) => `rgb(${a.map((v, i) => v + (c[i] - v) * f | 0)})`;
const rng = s => () => (s = s * 16807 % 2147483647) / 2147483647;
let W, H, S, sky = [], stars = [], diyas = [], lanterns = [], petals = [];
function fit() {
  const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; S = Math.min(W, H);
  [bg, fx].forEach(c => { c.width = W * d; c.height = H * d; }); b.setTransform(d, 0, 0, d, 0, 0); g.setTransform(d, 0, 0, d, 0, 0);
  const r = rng(7); sky = []; let x = -10;
  while (x < W) { const w = 26 + r() * 40, h = H * (.05 + r() * .12); sky.push({ x, w, h, dome: r() < .22, win: Array.from({ length: 80 }, r) }); x += w - 2; }
  stars = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H * .75, r: R() * 1.2 + .3, p: R() * 6.3 }));
  const n = clamp(W / 60 | 0, 5, 13), w = Math.min(54, W / n * .72);
  diyas = Array.from({ length: n }, (_, i) => ({ x: (i + .5) * W / n, y: H - w * .55 - 6, w, at: 1.7 + Math.abs(i - (n - 1) / 2) * .24, sd: i * 1.7 }));
  lanterns = Array.from({ length: 12 }, () => ({ x: R() * W, y: H * (.3 + R() * .9), s: S * (.025 + R() * .025), sp: S * (.012 + R() * .015), ph: R() * 6.3 }));
  petals = Array.from({ length: 34 }, () => ({ x: R() * W, y: R() * H, vy: S * (.04 + R() * .05), vx: (R() - .5) * 20, rot: R() * 6, vr: (R() - .5) * 3, s: S * (.008 + R() * .008) }));
}
addEventListener("resize", fit); fit();
// ---------- sound ----------
let AC, NB, mute = false, lastBoom = 0;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; } catch (e) { } }
  if (AC && AC.state === "suspended") AC.resume();
}
function noise(t, dur, type, f0, f1, vol) {
  const n = AC.createBufferSource(); n.buffer = NB; const f = AC.createBiquadFilter(), v = AC.createGain(); f.type = type;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t + dur);
  n.connect(f).connect(v).connect(AC.destination); n.start(t); n.stop(t + dur + .05);
}
function boom(vol = 1) {
  if (!AC || mute || AC.currentTime - lastBoom < .06) return; lastBoom = AC.currentTime; const t = AC.currentTime + .05;
  const o = AC.createOscillator(), v = AC.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(34, t + .4);
  v.gain.setValueAtTime(.5 * vol, t); v.gain.exponentialRampToValueAtTime(.001, t + .55); o.connect(v).connect(AC.destination); o.start(t); o.stop(t + .6);
  noise(t, .45, "lowpass", 1800, 200, .5 * vol);
}
const whoosh = () => { if (AC && !mute) noise(AC.currentTime, .8, "bandpass", 300, 2200, .1); };
const crackle = () => { if (AC && !mute) for (let i = 0; i < 6; i++) noise(AC.currentTime + .25 + R() * .5, .03, "highpass", 3000, 6000, .07); };
$("snd").onclick = e => { e.stopPropagation(); mute = !mute; $("snd").textContent = mute ? "♪ sound off" : "♪ sound on"; };
// ---------- fireworks ----------
const parts = [], rockets = [], flashes = [], PAL = [40, 48, 350, 325, 285, 210, 150, 25, 10], TYPES = ["peony", "peony", "ring", "heart", "willow", "double"];
function burst(x, y, type, big = 1, hue = PAL[R() * PAL.length | 0]) {
  const v0 = S * .8 * big * (.85 + R() * .3); flashes.push({ x, y, l: 1, r: S * .55 * big }); boom(big); if (R() < .6) crackle();
  const add = (n, fn, o = {}) => { for (let i = 0; i < n; i++) parts.push({ x, y, px: x, py: y, l: 1, dec: .55 + R() * .35, h: hue, sz: 1.3 + R() * 1.2, gr: S * .3, dr: .965, cr: R() < .25, ...o, ...fn(i, n) }); };
  const sph = (v, o) => { const a = R() * 6.283, s = v * (.4 + .6 * Math.sqrt(R())); return { vx: Math.cos(a) * s, vy: Math.sin(a) * s, ...o }; };
  if (type === "ring") { const tilt = .35 + R() * .65; add(80, (i, n) => ({ vx: Math.cos(i / n * 6.283) * v0, vy: Math.sin(i / n * 6.283) * v0 * tilt })); }
  else if (type === "heart") { const k = v0 / 17 * 1.05; add(110, (i, n) => { const u = i / n * 6.283; return { vx: 16 * Math.pow(Math.sin(u), 3) * k, vy: -(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * k, h: 345 + R() * 20, dec: .45, gr: S * .05, cr: false }; }); }
  else if (type === "willow") add(100, () => sph(v0 * .6), { h: 42, dec: .3 + R() * .12, gr: S * .45, dr: .975, sz: 1.2, cr: false });
  else if (type === "double") { add(90, () => sph(v0)); add(50, () => sph(v0 * .5), { h: hue + 160 }); }
  else add(120, () => sph(v0));
}
function launch(x0, tx, ty, type, big = 1) { whoosh(); rockets.push({ x0, tx, ty, t: 0, d: .85 + R() * .35, type, big, x: x0, y: H }); }
const shot = (big = 1, type = TYPES[R() * TYPES.length | 0]) => { const x0 = W * (.15 + R() * .7); launch(x0, x0 + (R() - .5) * W * .3, H * (.12 + R() * .3), type, big); };
// ---------- scene ----------
let T0 = null, queue = [], nextAuto = 0, lit = 0, last = performance.now();
function start() {
  audio(); T0 = performance.now(); $("hint").style.display = "none"; $("snd").style.display = "block";
  const at = (t, f) => queue.push([t, f]);
  [2.1, 2.7, 3.3].forEach(t => at(t, () => shot(1)));
  at(4.2, () => $("txt").classList.add("on"));
  ["heart", "ring", "peony", "double", "heart", "willow", "ring", "peony", "heart"].forEach((ty, k) => at(4.2 + k * .2, () => shot(1.25, ty)));
  nextAuto = 8;
}
addEventListener("pointerdown", e => {
  if (e.target.id === "snd") return;
  if (T0 === null) return start();
  audio(); launch(e.clientX + (R() - .5) * 80, e.clientX, Math.min(e.clientY, H * .75), TYPES[R() * TYPES.length | 0], 1.1);
});
function diya(c, x, y, w, fl, t, sd) {
  if (fl > 0) { const f = 1 + .1 * Math.sin(t * 13 + sd) + .07 * Math.sin(t * 7.3 + sd * 2), gr = c.createRadialGradient(x, y - w * .3, 0, x, y - w * .3, w * 2.4 * f);
    gr.addColorStop(0, `rgba(255,170,60,${.55 * fl})`); gr.addColorStop(1, "rgba(255,120,0,0)"); c.fillStyle = gr; c.fillRect(x - w * 3, y - w * 3, w * 6, w * 6); }
  c.fillStyle = "#8a3a1c"; c.beginPath(); c.moveTo(x - w / 2, y - w * .12); c.quadraticCurveTo(x - w * .45, y + w * .5, x, y + w * .52); c.quadraticCurveTo(x + w * .45, y + w * .5, x + w / 2, y - w * .12); c.quadraticCurveTo(x, y + w * .08, x - w / 2, y - w * .12); c.fill();
  c.strokeStyle = "#ffb457"; c.lineWidth = Math.max(1, w * .04); c.beginPath(); c.moveTo(x - w / 2, y - w * .12); c.quadraticCurveTo(x, y + w * .08, x + w / 2, y - w * .12); c.stroke();
  if (fl > 0) { const f = 1 + .12 * Math.sin(t * 13 + sd) + .08 * Math.sin(t * 7.3 + sd * 2), h = w * .62 * fl * f, sw = Math.sin(t * 5 + sd) * w * .04, gr = c.createLinearGradient(0, y - h, 0, y - w * .1);
    gr.addColorStop(0, "#fff6c8"); gr.addColorStop(.5, "#ffc23a"); gr.addColorStop(1, "#ff6a00"); c.fillStyle = gr; c.beginPath(); c.moveTo(x, y - w * .1);
    c.bezierCurveTo(x - w * .2, y - h * .4, x + sw - w * .05, y - h * .7, x + sw, y - h); c.bezierCurveTo(x + sw + w * .05, y - h * .7, x + w * .2, y - h * .4, x, y - w * .1); c.fill(); }
}
function drawBG(t, T, dt) {
  const L = lit, gr = b.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, mixc([3, 2, 12], [10, 6, 40], L)); gr.addColorStop(.6, mixc([5, 3, 14], [52, 16, 70], L)); gr.addColorStop(1, mixc([8, 4, 14], [150, 56, 30], L));
  b.globalCompositeOperation = "source-over"; b.globalAlpha = 1; b.fillStyle = gr; b.fillRect(0, 0, W, H);
  for (const s of stars) { b.fillStyle = `rgba(255,255,255,${(.25 + .35 * Math.sin(t * 1.3 + s.p)) * (.4 + .6 * L)})`; b.fillRect(s.x, s.y, s.r, s.r); }
  if (L > 0) { // rotating rangoli mandala
    const cx = W / 2, cy = H * .42, M = S * .46; b.save(); b.translate(cx, cy); b.globalCompositeOperation = "lighter";
    const rg = b.createRadialGradient(0, 0, 0, 0, 0, M); rg.addColorStop(0, `rgba(255,150,40,${.18 * L})`); rg.addColorStop(1, "rgba(255,80,0,0)"); b.fillStyle = rg; b.fillRect(-M, -M, 2 * M, 2 * M);
    [[8, .95, "#ff9d2e"], [12, .78, "#ff4d8d"], [16, .6, "#ffd36b"], [24, .44, "#8a6cff"], [12, .27, "#ff6a00"]].forEach(([n, rr, c], k) => {
      b.save(); b.rotate(t * .06 * (k % 2 ? -1 : 1) + k); b.strokeStyle = c; b.lineWidth = 1.3; b.globalAlpha = .26 * L;
      for (let i = 0; i < n; i++) { b.rotate(6.283 / n); b.beginPath(); b.ellipse(0, M * rr * .5, M * rr * .13 * (1 + .2 * Math.sin(t + k)), M * rr * .5, 0, 0, 6.283); b.stroke(); }
      b.restore(); });
    b.restore();
  }
  b.globalCompositeOperation = "lighter";
  for (const l of lanterns) { l.y -= l.sp * dt; if (l.y < -l.s * 3) { l.y = H + l.s * 3; l.x = R() * W; }
    const x = l.x + Math.sin(t * .6 + l.ph) * l.s * 1.5, g2 = b.createRadialGradient(x, l.y, 0, x, l.y, l.s * 2.6);
    g2.addColorStop(0, `rgba(255,170,60,${.5 * L})`); g2.addColorStop(1, "rgba(255,100,0,0)"); b.fillStyle = g2; b.fillRect(x - l.s * 3, l.y - l.s * 3, l.s * 6, l.s * 6);
    b.fillStyle = `rgba(255,200,110,${.85 * L})`; b.beginPath(); b.ellipse(x, l.y, l.s * .6, l.s * .78, 0, 0, 6.283); b.fill(); }
  b.globalCompositeOperation = "source-over";
  for (const s of sky) { b.fillStyle = "#0b0612"; b.fillRect(s.x, H - s.h, s.w, s.h + 2);
    if (s.dome) { b.beginPath(); b.arc(s.x + s.w / 2, H - s.h, s.w * .42, Math.PI, 0); b.fill(); b.fillRect(s.x + s.w / 2 - 1, H - s.h - s.w * .42 - s.w * .3, 2, s.w * .3); }
    const cols = Math.floor(s.w / 12), rows = Math.floor(s.h / 14);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const k = s.win[(r * cols + c) % 80]; if (k > .5) { b.fillStyle = `rgba(255,${190 + k * 40 | 0},90,${(.35 + .35 * Math.sin(t * 2 + k * 40)) * L})`; b.fillRect(s.x + 5 + c * 12, H - s.h + 8 + r * 14, 4, 6); } } }
  for (const d of diyas) diya(b, d.x, d.y, d.w, T < 0 ? 0 : ease(clamp((T - d.at) / .5)), t, d.sd);
  const ca = 1 - clamp((T - 2.4) / 1.8), cw = S * .3;      // the first big diya, fades after it has lit the others
  if (ca > 0) { b.globalAlpha = ca; diya(b, W / 2, H * .6, cw, T < 0 ? .0 : ease(clamp((T - .1) / .7)), t, 1); b.globalAlpha = 1; }
  b.globalCompositeOperation = "source-over";
  for (const p of petals) { if (L < .3) break; p.y += p.vy * dt; p.x += p.vx * dt + Math.sin(t + p.rot) * .3; p.rot += p.vr * dt; if (p.y > H + 10) { p.y = -10; p.x = R() * W; }
    b.save(); b.translate(p.x, p.y); b.rotate(p.rot); b.fillStyle = `rgba(255,${130 + (p.rot * 20 | 0) % 60},10,${.8 * L})`; b.beginPath(); b.ellipse(0, 0, p.s, p.s * .45, 0, 0, 6.283); b.fill(); b.restore(); }
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1e3), t = now / 1e3, T = T0 === null ? -1 : (now - T0) / 1e3, k = dt * 60; last = now;
  lit = T < 0 ? 0 : ease(clamp((T - .3) / 2.5));
  while (queue.length && queue[0][0] <= T) queue.shift()[1]();
  if (T > nextAuto && nextAuto) { const m = R(); if (m < .55) shot(1); else if (m < .85) { shot(1); setTimeout(() => shot(1), 250); setTimeout(() => shot(1.1), 500); } else for (let i = 0; i < 6; i++) setTimeout(() => shot(1.2), i * 160); nextAuto = T + .9 + R() * 1.3; }
  drawBG(t, T, dt);
  g.globalCompositeOperation = "destination-out"; g.fillStyle = `rgba(0,0,0,${1 - Math.pow(.8, k)})`; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "lighter"; g.lineCap = "round";
  for (let i = rockets.length - 1; i >= 0; i--) { const r = rockets[i]; r.t += dt; const p = clamp(r.t / r.d), e = 1 - (1 - p) * (1 - p); r.x = r.x0 + (r.tx - r.x0) * p; r.y = H + (r.ty - H) * e;
    parts.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: (R() - .5) * 30, vy: S * .12, l: .7, dec: 2.4, h: 38, sz: 1.8, gr: 0, dr: .95, cr: false });
    g.fillStyle = "#fff"; g.beginPath(); g.arc(r.x, r.y, 2.2, 0, 6.283); g.fill(); if (p >= 1) { burst(r.tx, r.ty, r.type, r.big); rockets.splice(i, 1); } }
  for (let i = flashes.length - 1; i >= 0; i--) { const f = flashes[i]; f.l -= dt * 3.2; if (f.l <= 0) { flashes.splice(i, 1); continue; }
    const rg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); rg.addColorStop(0, `rgba(255,220,160,${.4 * f.l})`); rg.addColorStop(1, "rgba(255,120,40,0)"); g.fillStyle = rg; g.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.px = p.x; p.py = p.y; const d = Math.pow(p.dr, k); p.vx *= d; p.vy *= d; p.vy += p.gr * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= p.dec * dt;
    if (p.cr && p.l < .3) { p.cr = false; if (parts.length < 3200) for (let j = 0; j < 3; j++) parts.push({ x: p.x, y: p.y, px: p.x, py: p.y, vx: (R() - .5) * S * .2, vy: (R() - .5) * S * .2, l: .6, dec: 2.2, h: 60, sz: 1.6, gr: 0, dr: .9, cr: false, w: 1 }); }
    if (p.l <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    const tw = p.w ? 1 : p.l < .5 ? .55 + .45 * Math.sin(p.l * 60 + i) : 1;
    g.strokeStyle = `hsla(${p.h},${p.w ? 20 : 100}%,${p.w ? 95 : 62}%,${Math.min(1, p.l * 1.4) * tw})`; g.lineWidth = p.sz; g.beginPath(); g.moveTo(p.px, p.py); g.lineTo(p.x, p.y); g.stroke(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
